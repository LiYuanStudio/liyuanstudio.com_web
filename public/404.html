<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 | LiYuan Studio</title>
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
  <style>
    :root {
      color-scheme: dark;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      background: #000000;
      color: #f5f5f7;
      text-align: center;
      padding: 24px;
    }
    body::before {
      content: '';
      position: fixed;
      top: -180px;
      right: -180px;
      width: min(760px, 85vw);
      aspect-ratio: 1;
      border-radius: 50%;
      pointer-events: none;
      background-image: radial-gradient(circle, rgba(20, 184, 166, 0.34) 1.8px, transparent 2px);
      background-size: 16px 16px;
      -webkit-mask-image: radial-gradient(circle at 60% 42%, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.35) 52%, transparent 74%);
      mask-image: radial-gradient(circle at 60% 42%, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.35) 52%, transparent 74%);
      opacity: 0.55;
    }
    main {
      position: relative;
      z-index: 1;
      width: min(100%, 440px);
      padding: 44px 32px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      background: #161619;
      text-align: center;
    }
    h1 {
      font-size: clamp(56px, 12vw, 76px);
      line-height: 1;
      letter-spacing: -0.04em;
      margin-bottom: 14px;
    }
    p {
      color: #b8b8c0;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    a {
      display: inline-flex;
      min-height: 44px;
      padding: 0 22px;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: #f5f5f7;
      color: #111111;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 180ms ease, transform 180ms ease;
    }
    a:hover {
      background: #dcdce1;
      transform: translateY(-2px);
    }
    a:focus-visible {
      outline: 3px solid #8cc7ff;
      outline-offset: 3px;
    }
    @media (prefers-reduced-motion: reduce) {
      a { transition: none; }
      a:hover { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>抱歉，这个页面不存在。</p>
    <a href="/">返回 LiYuan Studio 首页</a>
  </main>
</body>
</html>
